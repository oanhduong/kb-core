<title>Hỏi Số</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: the whole page is one full-screen game. A bright sky world (canvas) holds Màn 1, the vault; Màn 2 is an arena:
   a quest orb, one stage where each answer plays as an effect, and a hand of question cards at the bottom. */
:root{
  color-scheme:light;
  --sky-1:#9ed7ff; --sky-2:#e3f4ff; --sky-3:#fff4d8;
  --ink:#1d2b45; --ink-2:#4b5d7a; --ink-3:#8796ad;
  --line:#dbe6f1; --panel:#f3f8ff;
  --mint:#13c296; --mint-deep:#0a9774; --mint-soft:#d8f6ec;
  --yellow:#ffc42e; --yellow-deep:#e5a200; --yellow-soft:#fff2c7;
  --coral:#ff6a57; --coral-deep:#d9483a; --coral-soft:#ffe2dd;
  --violet:#7a6bff; --violet-soft:#e9e6ff; --blue:#3a8dff; --blue-deep:#2369d6; --blue-soft:#dcecff;
  --display:'Baloo 2','Nunito',system-ui,sans-serif;
  --font:'Nunito','Segoe UI',Roboto,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --gl:max(14px,env(safe-area-inset-left,0px)); --gr:max(14px,env(safe-area-inset-right,0px));
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky-2);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
h1,h2,h3,h4,h5{margin:0;font-family:var(--display);font-weight:800;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:where(button,a,input):focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ic{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic.f{fill:currentColor;stroke:none}

/* chunky game buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:18px;padding:14px 24px;font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1;text-decoration:none;white-space:nowrap;transition:transform .08s,box-shadow .08s,filter .15s}
.btn .ic{width:1.3em;height:1.3em}
.btn:hover{filter:brightness(1.05)}
.btn-go{background:var(--mint);color:#fff;box-shadow:0 6px 0 var(--mint-deep),0 16px 26px -12px rgba(10,151,116,.7)}
.btn-go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--mint-deep)}
.btn-sun{background:var(--yellow);color:#4a3200;box-shadow:0 6px 0 var(--yellow-deep),0 16px 26px -12px rgba(229,162,0,.7)}
.btn-sun:active{transform:translateY(4px);box-shadow:0 2px 0 var(--yellow-deep)}
.btn-white{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line),0 14px 22px -14px rgba(29,60,110,.4)}
.btn-white:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn-sm{padding:10px 16px;font-size:1rem;border-radius:14px}
.btn[disabled]{opacity:.6;cursor:not-allowed}

/* the game shell */
.game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 55%,var(--sky-3))}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.game.grabbing #scene{cursor:grabbing}
.game[data-level="2"] #scene,.game[data-level="3"] #scene{pointer-events:none;cursor:default}
#fxTop{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.game.dropping::after{content:"Thả file vào đây";position:absolute;inset:12px;z-index:55;border:4px dashed var(--mint);border-radius:28px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--mint-deep);background:rgba(216,246,236,.6);pointer-events:none}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + var(--st)) var(--gr) 10px var(--gl);pointer-events:none}
.hud > *{pointer-events:auto}
.hud .sp{flex:1;pointer-events:none}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--ink)}
.logo i{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--mint),var(--blue));color:#fff;display:grid;place-items:center;font-style:normal;font-size:1.1rem;box-shadow:0 3px 0 rgba(20,90,120,.35)}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 13px 0 6px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(29,43,69,.08),0 10px 20px -12px rgba(29,43,69,.35);font-weight:800;font-size:.92rem;white-space:nowrap}
.pill .badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--violet);color:#fff;font-family:var(--display);font-size:1.05rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.ring{width:26px;height:26px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .trk{stroke:var(--line)}
.ring .bar{stroke:var(--mint);stroke-linecap:round;stroke-dasharray:100.5;stroke-dashoffset:100.5;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.stars{display:inline-flex;gap:2px}
.stars .ic{width:15px;height:15px;color:#d7e0ec}
.stars .ic.on{color:var(--yellow);filter:drop-shadow(0 0 4px rgba(255,196,46,.9));animation:starpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes starpop{from{transform:scale(2.2) rotate(-40deg)}}
.coins{padding-left:8px}
.coins svg{width:24px;height:24px}
.coins b{font-family:var(--display);font-size:1.15rem;min-width:2ch;display:inline-block}
.coins b.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.35)}}
.hbtn{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink-2);box-shadow:0 3px 0 rgba(29,43,69,.08),0 10px 20px -12px rgba(29,43,69,.35)}
.hbtn .ic{width:20px;height:20px}
.hbtn.gift{width:auto;padding:0 16px 0 12px;display:inline-flex;gap:7px;text-decoration:none;background:var(--yellow);color:#4a3200;font-family:var(--display);font-weight:800;font-size:1rem;box-shadow:0 4px 0 var(--yellow-deep)}
.hbtn.gift:active{transform:translateY(2px);box-shadow:0 2px 0 var(--yellow-deep)}
.game[data-level="0"] .hud .pill{display:none}
@media (max-width:640px){
  .logo b,.hide-sm{display:none!important}
  .game:not([data-level="0"]) .hbtn.gift span{display:none}
  .game:not([data-level="0"]) .hbtn.gift{width:40px;padding:0;justify-content:center}
  .game:not([data-level="0"]) .logo{display:none}
  .hud{gap:6px}
  .pill{padding-right:10px;gap:6px}
}

/* title screen */
.title{position:absolute;inset:0;z-index:30;display:grid;place-items:end center;padding:calc(70px + var(--st)) 20px calc(max(28px,6vh) + var(--sb));background:linear-gradient(180deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.7) 70%,rgba(255,255,255,.85))}
.title .box{display:grid;justify-items:center;gap:16px;text-align:center;max-width:560px}
.mark{position:relative;width:96px;height:96px}
.mark span{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#86f0d2 30%,var(--mint) 62%,#0a8b6d);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:2.1rem;box-shadow:0 0 0 5px #fff,0 14px 30px -8px rgba(10,151,116,.7)}
.mark i{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(19,194,150,.55);animation:orbring 2.4s infinite}
.mark i:nth-child(2){animation-delay:.8s}.mark i:nth-child(3){animation-delay:1.6s}
@keyframes orbring{from{transform:scale(.85);opacity:.9}to{transform:scale(1.9);opacity:0}}
.title h1{font-size:clamp(3.4rem,13vw,6rem);color:var(--ink);text-shadow:0 5px 0 #fff,0 14px 34px rgba(58,141,255,.35)}
.title p{font-size:clamp(1.1rem,3.8vw,1.4rem);font-weight:800;color:var(--ink-2)}
.btn-play{font-size:1.6rem;padding:20px 44px;border-radius:24px;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.btn-play:active{animation:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.9);border-radius:999px;padding:7px 12px;font-weight:800;font-size:.84rem;color:var(--ink-2);box-shadow:0 3px 0 rgba(29,43,69,.06)}
.chip .ic{width:16px;height:16px;color:var(--mint-deep)}

/* Màn 1 overlay */
.l1{position:absolute;inset:0;z-index:5;pointer-events:none}
.l1 .dock{pointer-events:auto}
.game[data-level="0"] .l1 .dock{visibility:hidden}
.hand{position:absolute;left:0;top:0;z-index:8;pointer-events:none;display:flex;align-items:flex-start;gap:4px;opacity:0;will-change:transform,opacity}
.hand svg{width:52px;height:52px;filter:drop-shadow(0 6px 6px rgba(29,43,69,.3))}
.hand span{margin-top:40px;background:var(--ink);color:#fff;border-radius:999px;padding:5px 11px;font-weight:900;font-size:.85rem;white-space:nowrap}
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 var(--gr) calc(14px + var(--sb)) var(--gl);display:grid;justify-items:center;gap:12px}
.acts{display:flex;gap:22px;align-items:flex-end}
.rbtn{display:grid;justify-items:center;gap:6px;border:0;background:none;padding:0;font-weight:900;font-size:.84rem;color:var(--ink)}
.rbtn .c{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:#fff;box-shadow:0 6px 0 var(--mint-deep),0 14px 24px -10px rgba(10,151,116,.75);transition:transform .08s}
.rbtn .c .ic{width:32px;height:32px}
.rbtn:active .c{transform:translateY(4px);box-shadow:0 2px 0 var(--mint-deep)}
.rbtn.alt .c{width:56px;height:56px;background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line),0 12px 20px -12px rgba(29,60,110,.45)}
.rbtn.alt .c .ic{width:26px;height:26px}
.rbtn.alt:active .c{box-shadow:0 2px 0 var(--line)}
.rbtn small{font-size:.84rem;background:rgba(255,255,255,.92);padding:3px 10px;border-radius:999px;white-space:nowrap}
.rbtn.next .c{width:56px;height:56px;background:var(--blue);box-shadow:0 5px 0 var(--blue-deep),0 12px 20px -10px rgba(35,105,214,.7)}
.rbtn.next .c .ic{width:28px;height:28px}
.rbtn.next:active .c{box-shadow:0 2px 0 var(--blue-deep)}
.rbtn[disabled]{cursor:not-allowed;opacity:.5;filter:grayscale(1)}
.rbtn[disabled] .c{animation:none;transform:none}
.rbtn.glow .c{animation:glow 1.3s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08);box-shadow:0 6px 0 var(--mint-deep),0 0 0 10px rgba(19,194,150,.18),0 14px 24px -10px rgba(10,151,116,.75)}}
.inv{display:flex;gap:6px;padding:6px;border-radius:18px;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 0 rgba(29,43,69,.06),0 12px 24px -16px rgba(29,43,69,.45);max-width:100%;overflow-x:auto;scrollbar-width:none}
.inv::-webkit-scrollbar{display:none}
.slot{width:40px;height:40px;border-radius:12px;border:2px dashed rgba(29,43,69,.16);flex:none;display:grid;place-items:center;font-family:var(--mono);font-size:.58rem;font-weight:500;color:#fff;padding:0;background:transparent}
.slot.full{background:var(--c);border:0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);animation:slotin .45s cubic-bezier(.2,1.6,.4,1);cursor:pointer}
@keyframes slotin{from{transform:scale(.2)}}
@media (max-width:420px){.slot{width:34px;height:34px;border-radius:10px;font-size:.52rem}.rbtn .c{width:62px;height:62px}.rbtn.alt .c{width:50px;height:50px}}
.loot{position:absolute;z-index:9;width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:.6rem;pointer-events:none;box-shadow:0 8px 16px -6px rgba(0,0,0,.35);transition:transform .65s cubic-bezier(.45,0,.2,1),opacity .2s;transform-origin:0 0}
.lootlbl{position:absolute;z-index:9;pointer-events:none;transform:translate(-50%,-100%);background:var(--ink);color:#fff;font-weight:800;font-size:.8rem;padding:5px 10px;border-radius:10px;white-space:nowrap;animation:lbl 1.7s ease-out forwards}
.lootlbl::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--ink)}
@keyframes lbl{0%{opacity:0;margin-top:6px}12%{opacity:1;margin-top:-4px}80%{opacity:1}100%{opacity:0;margin-top:-14px}}
.vhint{position:absolute;z-index:7;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:1.1rem;color:#fff;background:var(--mint);border-radius:999px;padding:4px 14px;box-shadow:0 4px 0 var(--mint-deep);opacity:0;transition:opacity .15s}
.vhint.on{opacity:1}
.pop{position:absolute;z-index:12;pointer-events:none;font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--yellow);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;animation:popup 1s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
.pop.big{font-size:2.2rem;color:#fff}
.pop.miss{font-size:1.2rem;color:#fff;-webkit-text-stroke:4px var(--coral-deep)}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:28;transition:opacity .35s}
.flash.on{opacity:1;transition:none}

/* banner */
.banner{position:absolute;left:50%;top:42%;z-index:26;transform:translate(-50%,-50%);opacity:0;text-align:center;pointer-events:none;display:grid;gap:8px;justify-items:center}
.banner b{font-family:var(--display);font-weight:800;font-size:clamp(3rem,12vw,5.4rem);line-height:1;color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);white-space:nowrap}
.banner span{font-family:var(--display);font-weight:800;font-size:1.35rem;color:#4a3200;background:var(--yellow);padding:5px 18px;border-radius:999px;box-shadow:0 4px 0 var(--yellow-deep)}
.banner.on{animation:banner 1.9s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(2deg)}24%{transform:translate(-50%,-50%) scale(1) rotate(0)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(.96)}}

/* Màn 2 arena */
.l2{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;gap:10px;padding:calc(66px + var(--st)) var(--gr) calc(10px + var(--sb)) var(--gl);overflow-y:auto;overflow-x:hidden;animation:arenain .6s cubic-bezier(.2,1,.3,1) both}
@keyframes arenain{from{opacity:0;transform:scale(.96)}}
.arena{position:relative;flex:1;min-height:330px;width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;padding-top:32px}
.orb{position:absolute;left:50%;top:0;margin-left:-34px;width:68px;height:68px;z-index:4}
.orb span{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#86f0d2 30%,var(--mint) 62%,#0a8b6d);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:1.5rem;box-shadow:0 0 0 4px #fff,0 10px 22px -6px rgba(10,151,116,.75)}
.orb i{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(19,194,150,.5);animation:orbring 2.4s infinite}
.orb i:nth-child(2){animation-delay:.8s}.orb i:nth-child(3){animation-delay:1.6s}
.orb.charge span{animation:charge .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes charge{30%{transform:scale(1.35);box-shadow:0 0 0 4px #fff,0 0 0 18px rgba(19,194,150,.25),0 0 40px 10px rgba(19,194,150,.6)}}
.orb.no span{animation:no .45s;background:radial-gradient(circle at 35% 30%,#fff,#ffb3a8 30%,var(--coral) 62%,var(--coral-deep))}
@keyframes no{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.stage{position:relative;flex:1;min-height:290px;border-radius:26px;background:linear-gradient(180deg,#ffffff,#eef6ff);border:4px solid #fff;box-shadow:0 22px 44px -24px rgba(29,60,110,.55),0 0 0 1px var(--line);overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(58,141,255,.12) 1.2px,transparent 1.2px);background-size:18px 18px;pointer-events:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sdom{position:absolute;inset:0;padding:42px 18px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:600px){.sdom{padding:40px 12px 12px;gap:8px}}
.stage.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.win{position:absolute;left:50%;top:calc(58px + var(--st));width:min(460px,calc(100% - 28px));transform:translateX(-50%);z-index:24;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:20px;background:var(--ink);color:#fff;box-shadow:0 0 0 3px var(--yellow),0 16px 30px -10px rgba(0,0,0,.5);animation:winin .55s cubic-bezier(.2,1.4,.3,1) both}
.win.out{animation:winout .35s ease-in forwards}
@keyframes winin{from{transform:translate(-50%,-160%) scale(.9);opacity:0}}
@keyframes winout{to{transform:translate(-50%,-160%);opacity:0}}
.win .st{width:42px;height:42px;color:var(--yellow);flex:none;filter:drop-shadow(0 0 8px rgba(255,196,46,.7))}
.win > span{display:grid;min-width:0}
.win small{color:#9fdcc8;font-weight:900;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.win b{font-family:var(--display);font-size:1.2rem;line-height:1.1}
@media (max-width:600px){.win b{font-size:1.02rem}.win{gap:10px;padding:9px 12px}.win .st{width:34px;height:34px}}
.win .pts{margin-left:auto;font-family:var(--display);font-weight:800;color:var(--yellow);font-size:1.3rem;white-space:nowrap}
.askbar{max-width:820px;width:100%;margin:0 auto;display:flex;gap:8px;align-items:center;background:#fff;border-radius:999px;padding:6px 6px 6px 16px;box-shadow:0 4px 0 var(--line),0 14px 24px -16px rgba(29,60,110,.45)}
.askbar > .ic{color:var(--ink-3);width:20px;height:20px}
.askbar input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:16px;font-weight:700;background:none;color:var(--ink)}
.askbar input::placeholder{color:var(--ink-3)}
.askbar button{width:44px;height:44px;border-radius:50%;border:0;background:var(--mint);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--mint-deep);flex:none}
.askbar button .ic{width:20px;height:20px}
.cards{display:flex;gap:10px;max-width:1000px;width:100%;margin:0 auto;justify-content:center;padding:8px 2px 6px}
@media (max-width:1020px){.cards{justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;width:auto;margin-inline:calc(-1 * var(--gl)) calc(-1 * var(--gr));padding-inline:var(--gl) var(--gr)}.cards::-webkit-scrollbar{display:none}}
.qcard{flex:0 0 152px;scroll-snap-align:start;position:relative;border:0;border-radius:20px;background:#fff;padding:12px;text-align:left;display:grid;gap:8px;align-content:start;box-shadow:0 6px 0 var(--line),0 16px 26px -16px rgba(29,60,110,.5);transition:transform .15s,box-shadow .15s;min-height:136px;color:var(--ink)}
.qcard:hover{transform:translateY(-6px) rotate(-1.5deg)}
.qcard:active{transform:translateY(2px)}
.qcard.on{box-shadow:0 6px 0 var(--c),0 0 0 3px var(--c),0 16px 26px -16px rgba(29,60,110,.5)}
.qcard .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--s);color:var(--c)}
.qcard .ico .ic{width:24px;height:24px}
.qcard b{font-weight:900;font-size:.92rem;line-height:1.25}
.qcard small{font-size:.68rem;font-weight:900;color:var(--c);text-transform:uppercase;letter-spacing:.05em}

<script>
/* ============================================================
   CONFIG
   ============================================================ */
// Địa chỉ web app (KB Explorer). build-standalone.sh điền từ biến môi trường APP_URL; chưa có thì dùng app chạy local.
const APP_URL_BUILD = '%%APP_URL%%';
const CONFIG = { BRAND: 'Hỏi Số', ENDPOINT: '', APP_URL: (/^%%/.test(APP_URL_BUILD) || !APP_URL_BUILD ? 'http://localhost:3000' : APP_URL_BUILD).replace(/\/+$/, '') };
const appLink = from => `${CONFIG.APP_URL}/signup?utm_source=game&utm_content=${encodeURIComponent(from || 'app')}`;

/* ============================================================
   Utilities
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const nf = new Intl.NumberFormat('vi-VN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const ease = {
  linear: t => t, outCubic: t => 1 - Math.pow(1 - t, 3), inCubic: t => t * t * t,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};
const tweens = new Set();
function tween(obj, to, dur, o = {}){
  const from = {}; for (const k in to) from[k] = obj[k];
  const t = { obj, from, to, dur: reduced ? Math.min(dur, 80) : dur, start: performance.now() + (o.delay || 0), ease: o.ease || ease.outCubic, onUpdate: o.onUpdate, onDone: o.onDone };
  tweens.add(t); return t;
}
function stepTweens(now){
  for (const t of tweens){
    if (now < t.start) continue;
    const p = clamp((now - t.start) / t.dur, 0, 1), v = t.ease(p);
    for (const k in t.to) t.obj[k] = t.from[k] + (t.to[k] - t.from[k]) * v;
    t.onUpdate && t.onUpdate(v, p);
    if (p >= 1){ tweens.delete(t); t.onDone && t.onDone(); }
  }
}
function rr(ctx, x, y, w, h, r){ r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function hexA(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function vibrate(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch {} }
function fmtSize(b){ return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }
const icon = (id, cls = 'ic') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const GAME = $('#game');

/* ============================================================
   Tracking (Google Sheet via Apps Script, dataLayer, local copy)
   ============================================================ */
const SESSION = { sid: uid(), vid: store.get('hs_vid') || (() => { const v = uid(); store.set('hs_vid', v); return v; })(), utm: {}, referrer: document.referrer ? document.referrer.slice(0, 120) : '' };
(() => { const q = new URLSearchParams(location.search); ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'ref'].forEach(k => { const v = q.get(k); if (v) SESSION.utm[k] = v.slice(0, 80); }); })();
function post(payload){ if (!CONFIG.ENDPOINT) return; try { fetch(CONFIG.ENDPOINT, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) }); } catch {} }
function track(name, props = {}){
  const ev = { t: Date.now(), name, ...props };
  try { const l = store.get('hs_game_events') || []; l.push({ sid: SESSION.sid, ...ev }); store.set('hs_game_events', l.slice(-300)); } catch {}
  window.dataLayer = window.dataLayer || []; window.dataLayer.push({ event: 'game_' + name, ...props });
  post({ type: 'event', sid: SESSION.sid, vid: SESSION.vid, variant: 'game', referrer: SESSION.referrer, ...SESSION.utm, ...ev });
}

/* ============================================================
   Sound: tiny synth blips, only after the player presses Play
   ============================================================ */
const sfx = (() => {
  let ac = null, on = store.get('hs_sound') !== false, armed = false;
  function ctx(){ if (!armed) return null; if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } } return ac; }
  function tone(f, d, type = 'sine', v = .05, slide = 0, delay = 0){
    const a = ctx(); if (!a || !on) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f * slide), t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + d + .03);
  }
  return {
    arm(){ armed = true; const a = ctx(); a && a.resume && a.resume(); },
    pop(n = 0){ tone(420 + n * 70, .14, 'triangle', .07, 1.8); },
    coin(){ tone(1046, .07, 'square', .02); tone(1568, .1, 'square', .02, 0, .06); },
    whoosh(){ tone(260, .32, 'sawtooth', .018, 3.2); },
    star(){ [784, 988, 1318].forEach((f, i) => tone(f, .2, 'triangle', .06, 0, i * .09)); },
    level(){ [523, 659, 784, 1046].forEach((f, i) => tone(f, .24, 'triangle', .07, 0, i * .11)); },
    block(){ tone(160, .3, 'square', .05, .45); },
    type(){ tone(1400 + Math.random() * 400, .02, 'square', .008); },
    get on(){ return on; },
    set on(v){ on = !!v; store.set('hs_sound', on); }
  };
})();

/* ============================================================
   Score, pops, banner, toast
   ============================================================ */
const game = { score: 0, shown: 0, level: 0, stars: [] };
function renderScore(){ $('#score').textContent = nf.format(Math.round(game.shown)); }
function bumpScore(){ const b = $('#score'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
function addScore(n, at){
  game.score += n;
  if (at && !reduced){
    const cnt = clamp(Math.round(n / 60), 3, 10), share = n / cnt;
    fxTop.coinsTo(at.x, at.y, cnt, () => { game.shown = Math.min(game.score, game.shown + share); renderScore(); bumpScore(); sfx.coin(); });
  } else { game.shown = game.score; renderScore(); bumpScore(); }
}
function popAt(text, x, y, cls = ''){ const p = document.createElement('div'); p.className = 'pop ' + cls; p.textContent = text; p.style.left = x + 'px'; p.style.top = y + 'px'; GAME.appendChild(p); setTimeout(() => p.remove(), 1050); }
function banner(big, small){
  const b = $('#banner'); b.querySelector('b').textContent = big; const s = b.querySelector('span'); s.textContent = small || ''; s.hidden = !small;
  b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
}
let toastT;
function toast(text){ const t = $('#toast'); t.textContent = text; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }
function flash(){ const f = $('#flash'); f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 70); }

/* ============================================================
   Full-screen effects layer: coins flying to the score, confetti
   ============================================================ */
const fxTop = (() => {
  const cv = $('#fxTop'), c = cv.getContext('2d'); let W = 0, H = 0, DPR = 1;
  const coins = [], conf = [];
  function resize(){ W = GAME.clientWidth; H = GAME.clientHeight; DPR = Math.min(2, devicePixelRatio || 1); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
  function coinsTo(x, y, n, onEach){
    const t = $('#score').getBoundingClientRect(), tx = t.left + t.width / 2, ty = t.top + t.height / 2;
    for (let i = 0; i < n; i++){ const sx = x + rand(-26, 26), sy = y + rand(-16, 16); coins.push({ sx, sy, tx, ty, cx: (sx + tx) / 2 + rand(-140, 140), cy: Math.min(sy, ty) - rand(40, 160), t: -i * .07, dur: rand(.55, .8), r: rand(0, 6), onEach }); }
  }
  function confetti(n = 180){
    if (reduced) return;
    const cols = ['#ffc42e', '#13c296', '#3a8dff', '#7a6bff', '#ff6a57', '#ffffff'];
    for (let i = 0; i < n; i++) conf.push({ x: rand(0, W), y: rand(-H * .6, -10), vx: rand(-60, 60), vy: rand(140, 300), r: rand(4, 8), a: rand(0, 6.28), va: rand(-7, 7), col: cols[i % cols.length], life: rand(3, 5) });
  }
  function drawCoin(x, y, r, spin){
    const sx = Math.max(.25, Math.abs(Math.cos(spin)));
    c.save(); c.translate(x, y); c.scale(sx, 1);
    c.fillStyle = '#e5a200'; c.beginPath(); c.arc(0, 1.5, r, 0, 6.283); c.fill();
    c.fillStyle = '#ffc42e'; c.beginPath(); c.arc(0, 0, r, 0, 6.283); c.fill();
    c.strokeStyle = '#fff3c4'; c.lineWidth = 1.6; c.beginPath(); c.arc(0, 0, r * .55, 0, 6.283); c.stroke();
    c.restore();
  }
  function frame(dt){
    c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, W, H);
    for (let i = coins.length - 1; i >= 0; i--){
      const p = coins[i]; p.t += dt; if (p.t < 0) continue;
      const u = Math.min(1, p.t / p.dur), e = ease.inOutCubic(u), v = 1 - e;
      const x = v * v * p.sx + 2 * v * e * p.cx + e * e * p.tx, y = v * v * p.sy + 2 * v * e * p.cy + e * e * p.ty;
      drawCoin(x, y, 10 - u * 3, p.r + p.t * 12);
      if (u >= 1){ coins.splice(i, 1); p.onEach && p.onEach(); }
    }
    for (let i = conf.length - 1; i >= 0; i--){
      const p = conf[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt; p.life -= dt;
      if (p.life <= 0 || p.y > H + 20){ conf.splice(i, 1); continue; }
      c.save(); c.translate(p.x, p.y); c.rotate(p.a); c.fillStyle = p.col; c.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); c.restore();
    }
    if (!coins.length && game.shown !== game.score){ game.shown = game.score; renderScore(); }
  }
  resize();
  return { resize, coinsTo, confetti, frame };
})();

/* ============================================================
   File catalogue: what a Vietnamese shop keeps lying around

const EXT = {

const FILE_DEFS = [

  { name: 'KiotViet_don_hang.csv', found: '8.512 đơn hàng' },

const extOf = name => (name.split('.').pop() || '').toLowerCase();

/* ============================================================
   Màn 1: the vault world (pseudo-3D on Canvas 2D, no library)
   ============================================================ */
const act1 = (() => {
  const cv = $('#scene'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, k = 1, F = 760, mobile = false, cx0 = 0, cy0 = 0, cy0T = 0;
  const CAMZ = 900;
  const cam = { rotY: 0, rotX: 0.42, tx: 0, ty: 0, baseY: 0 };
  const VAULT = { x: 0, y: 250, z: 0, r: 175 };
  const st = { files: [], parts: [], clouds: [], t: 0, pulse: 0, beam: .3, ringScale: 1, zoom: 1, hunger: 0, count: 0, total: 0, combo: 0, lastDrop: 0, lastAct: 0, done: false, hover: null, drag: null, mode: 'play', hintOn: false, vaultEl: { x: 0, y: 0, rx: 1, ry: 1 } };
  const LIGHT = (() => { const v = { x: -.35, y: -.55, z: -.75 }; const l = Math.hypot(v.x, v.y, v.z); return { x: v.x / l, y: v.y / l, z: v.z / l }; })();

  function resize(){
    W = cv.clientWidth; H = cv.clientHeight; DPR = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    mobile = W < 760;
    k = clamp(Math.min(W / 760, H / 700), .5, 1.25);

/* ============================================================
   Flow: title, levels, final, app button
   ============================================================ */
function setLevel(n){
  $('#lvlNo').textContent = n; $('#lvlName').textContent = n === 1 ? 'Nạp kho' : 'Hỏi kho';
  $('#lvl1').hidden = n !== 1; $('#stars').hidden = n !== 2;
  $('#lvlNo').style.background = n === 2 ? 'var(--blue)' : 'var(--violet)';
}
function startPlay(via){
  if (game.level !== 0) return;
  game.level = 1; GAME.dataset.level = '1'; setLevel(1);
  sfx.arm();
  const t = $('#title'); t.style.transition = 'opacity .35s'; t.style.opacity = '0'; setTimeout(() => { t.hidden = true; }, 360);
  act1.st.hintOn = true; act1.st.lastAct = performance.now();
  if (via === 'button'){
    banner('MÀN 1', 'Nạp kho');
    try { if (matchMedia('(pointer: coarse)').matches && document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); } catch {}
  }
  track('play', { via });
}
function final(){
  game.level = 3; GAME.dataset.level = '3';
  addScore(1000); fxTop.confetti(220); sfx.level();
  $('#finalScore').textContent = nf.format(game.score);
  $('#finalBadges').innerHTML = CARDS.map((c, i) => `<span style="--c:${c.c};--s:${c.s};animation-delay:${200 + i * 90}ms" title="${esc(c.tag)}">${icon(c.icon)}</span>`).join('');
  $('#final').hidden = false;
  track('all_clear', { score: game.score });
}
function replay(){
  $('#final').hidden = true; arena.reset(); act1.reset();
  game.level = 1; GAME.dataset.level = '1'; setLevel(1);
  $('#l1').hidden = false; act1.st.hintOn = true;
  banner('MÀN 1', 'Nạp kho'); track('replay');
}
function nextLevel(){ if (game.level !== 1 || act1.st.done || act1.st.count < 1) return; act1.st.done = true; act1.st.hintOn = false; $('#btnNext').disabled = true; track('next', { files: act1.st.count }); flash(); sfx.level(); arena.show(); }


function setSound(on){
  sfx.on = on;
  $('#btnSound').innerHTML = icon(on ? 'sound' : 'mute'); $('#btnSound').setAttribute('aria-label', on ? 'Tắt tiếng' : 'Bật tiếng');
}
$('#btnPlay').addEventListener('click', () => startPlay('button'));
$('#btnNext').addEventListener('click', nextLevel);
$('#btnSound').addEventListener('click', () => setSound(!sfx.on));
$('#finalReplay').addEventListener('click', replay);
$('#logo').addEventListener('click', e => e.preventDefault());
$$('.appbtn').forEach(a => { a.href = appLink(a.dataset.from); });
GAME.addEventListener('click', e => { const a = e.target.closest('.appbtn'); if (a) track('app_open', { from: a.dataset.from || '', level: game.level, stars: game.stars.length, score: game.score }); });
$$('.brandRef').forEach(el => el.textContent = CONFIG.BRAND);

/* ============================================================
   Main loop
   ============================================================ */
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  stepTweens(now);
  if (!document.hidden){ act1.frame(dt, now); arena.frame(dt, now); fxTop.frame(dt); }
  requestAnimationFrame(loop);
}
addEventListener('resize', () => { act1.resize(); fxTop.resize(); });
setSound(sfx.on); renderScore(); setLevel(1);
track('view', { w: innerWidth, h: innerHeight });
function start(saved){
  if (saved && saved.level >= 1){ startPlay('restore'); if (saved.level >= 2){ act1.st.done = true; arena.show(); } }
  else if (/(^|[#&])play\b/.test(location.hash)) startPlay('link');
  requestAnimationFrame(loop);
}
try { window.claude?.hot?.snapshot?.(() => ({ level: game.level })); } catch {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
