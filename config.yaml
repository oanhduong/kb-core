auth:
  jwt_algorithm: HS256
  jwt_issuer: retailkb
  jwt_ttl_minutes: 720
  default_rate_limit_per_minute: 120   # API key service-to-service
  user_rate_limit_per_minute: 30       # JWT user

observability:
  langfuse_enabled: true
  trace_retention_days: 30
  audit_retention_days: 365
  abstention_retention_days: 180

alerts:
  enabled: true
  channel: ${ALERT_CHANNEL:-slack}     # slack | telegram | generic
  check_interval_seconds: 60
  cooldown_minutes: 60
  daily_cost_usd: 20.0
  error_rate_5m: 0.2
  error_rate_min_requests: 10
  abstention_spike_ratio: 2.0
  abstention_min_questions: 20
  abstention_baseline_days: 7
  review_queue_max: 30

worker:
  poll_interval_seconds: 2.0
  max_attempts: 3
  stale_lock_minutes: 30
  retention_interval_hours: 6
